[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "gamepadly"
version = "0.1.0"
description = "Linux gamepad-to-keyboard/mouse mapper for couch gaming, with evmapy-compatible profiles"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
authors = [{ name = "Manu Romero", email = "manu4.2012@gmail.com" }]
keywords = ["gamepad", "controller", "evdev", "uinput", "pygame", "emulation", "evmapy", "retrobox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = [
    "pygame>=2.1",
    "evdev>=1.6; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "build", "twine"]

[project.scripts]
gamepadly-mapper = "gamepadly.mapper.cli:main"

[project.urls]
Homepage = "https://github.com/RetroboxProject/gamepadly"
Repository = "https://github.com/RetroboxProject/gamepadly"
Issues = "https://github.com/RetroboxProject/gamepadly/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gamepadly"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/system", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
